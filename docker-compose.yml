# ============================================================================
# YAML Anchors / Extension Fields
# ============================================================================

x-kafka-broker-common: &kafka-broker-common
  image: confluentinc/cp-kafka:7.6.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 10s
    retries: 5
    start_period: 30s

x-kafka-env-common: &kafka-env-common
  # KRaft mode settings (no Zookeeper)
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  # Listener configuration
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Cluster settings (production-like)
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Performance tuning
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_LOG_SEGMENT_BYTES: 1073741824
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

x-kafka-depends-on: &kafka-depends-on
  kafka-1:
    condition: service_healthy
  kafka-2:
    condition: service_healthy
  kafka-3:
    condition: service_healthy

# ============================================================================
# Services
# ============================================================================

services:
  documentation:
    # Pinned to 9.7.1 (last version without MkDocs 2.0 warning banner)
    # Material for MkDocs is in maintenance mode until Nov 2026
    # See: https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
    image: squidfunk/mkdocs-material:9.7.1
    container_name: mkdocs
    hostname: mkdocs
    command: serve --dev-addr=0.0.0.0:8010 --watch-theme
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      - ./documentation:/docs:ro
    profiles:
      - docs
      - ui

  # ============================================================================
  # Kafka Infrastructure (3-broker KRaft cluster)
  # ============================================================================
  # Production-like setup with KRaft (no Zookeeper):
  # - 3 Kafka nodes in combined mode (broker + controller)
  # - Controller quorum for metadata management
  # - Replication factor = 3 (every partition on all brokers)
  # - Min ISR = 2 (at least 2 replicas must acknowledge writes)
  # ============================================================================
  # Ports:
  # - CONTROLLER (9093): controller quorum communication (Docker network only)
  # - INTERNAL (9092): inter-broker + internal client (Docker network only)
  # - EXTERNAL (29092/29093/29094): client access from host machine
  # ============================================================================

  kafka-1:
    <<: *kafka-broker-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "29092:29092"  # EXTERNAL only - for host access
    environment:
      <<: *kafka-env-common
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_JMX_PORT: 9991
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-broker-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29093:29093"  # EXTERNAL only - for host access
    environment:
      <<: *kafka-env-common
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093
      KAFKA_JMX_PORT: 9992
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-broker-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "29094:29094"  # EXTERNAL only - for host access
    environment:
      <<: *kafka-env-common
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:29094
      KAFKA_JMX_PORT: 9993
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # Schema Registry - NOT USED
  # We use Pydantic + JSON instead of Avro + Schema Registry
  # See: documentation/docs/technologies/kafka.md#schema-registry

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    depends_on:
      <<: *kafka-depends-on
    ports:
      - "7001:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9991
      DYNAMIC_CONFIG_ENABLED: "true"
      # Default serde for message display (removes "Fallback" warning)
      KAFKA_CLUSTERS_0_DEFAULTKEYSERDE: String
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: String
    profiles:
      - ui

  # ============================================================================
  # PostgreSQL + PgBouncer (Connection Pooling)
  # ============================================================================

  postgres_storefront_catalog_service:
    image: postgres:17
    container_name: postgres_storefront_catalog_service
    hostname: postgres_storefront_catalog_service
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5555:5432"
    env_file:
      - .env
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    hostname: pgbouncer
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_PORT}:6432"
    environment:
      # Database connection settings
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: "${POSTGRES_PORT}"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      # PgBouncer listen settings
      LISTEN_PORT: "6432"
      # Auth settings
      AUTH_TYPE: scram-sha-256
      # Pool settings
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE}
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      SERVER_RESET_QUERY: "DISCARD ALL"
      # Admin settings
      ADMIN_USERS: ${POSTGRES_USER}
      STATS_USERS: ${POSTGRES_USER}
      # Logging
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
    env_file:
      - .env
    depends_on:
      postgres_storefront_catalog_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================================
  # Application Services
  # ============================================================================

  storefront_catalog_service:
    container_name: storefront_catalog_service
    hostname: storefrontCatalogService
    ports:
      - "8000:8000"
    build:
      dockerfile: Dockerfile
      context: ./storefront_catalog_service
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      <<: *kafka-depends-on
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: |
      sh -c "
      echo 'Waiting for PgBouncer...' &&
      sleep 5 &&
      echo 'Running migrations directly against PostgreSQL...' &&
      USE_PGBOUNCER=false uv run python manage.py migrate &&
      uv run python manage.py create_kafka_topics --partitions 3 --replication-factor 3 &&
      uv run python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./storefront_catalog_service/app:/app
    env_file:
      - .env

  celery_worker:
    container_name: celery_worker
    build:
      dockerfile: Dockerfile
      context: ./storefront_catalog_service
    command: celery -A celery_app worker -l info -Q default,emails,heavy
    volumes:
      - ./storefront_catalog_service/app:/app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    env_file:
      - .env

  celery_beat:
    container_name: celery_beat
    build:
      dockerfile: Dockerfile
      context: ./storefront_catalog_service
    command: celery -A celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./storefront_catalog_service/app:/app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    env_file:
      - .env

  # ============================================================================
  # Celery Flower — task monitoring UI
  # ============================================================================
  # UI: http://localhost:5556
  # Shows: active/completed/failed tasks, workers, queues, task history
  # ============================================================================

  flower:
    build:
      dockerfile: Dockerfile
      context: ./storefront_catalog_service
    container_name: flower
    hostname: flower
    command: celery -A celery_app flower --port=5555
    restart: unless-stopped
    ports:
      - "5556:5555"
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery_worker:
        condition: service_started
    volumes:
      - ./storefront_catalog_service/app:/app
    profiles:
      - ui

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"  # UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  storefront_catalog_service_frontend:
    build:
      dockerfile: Dockerfile
      context: ./storefront_catalog_service_frontend/app
    container_name: storefront_catalog_service_frontend
    hostname: storefrontCatalogServiceFrontend
    ports:
      - "5173:5173"
    volumes:
      - ./storefront_catalog_service_frontend/app:/app
      - frontend_node_modules:/app/node_modules

  # ============================================================================
  # Notification Service (FastStream Kafka Consumer)
  # ============================================================================
  # Consumes messages from Kafka topics and sends notifications via SMS/Email.
  # Uses FastStream framework for async message processing.
  # ============================================================================
  # Endpoints:
  # - http://localhost:11111/docs   - AsyncAPI documentation
  # - http://localhost:11111/health - Health check endpoint
  # ============================================================================

  notification_service:
    container_name: notification_service
    hostname: notificationService
    build:
      dockerfile: Dockerfile
      context: ./notification_service
    restart: unless-stopped
    ports:
      - "11111:11111"
    depends_on:
      <<: *kafka-depends-on
      storefront_catalog_service:
        condition: service_healthy
    command: ["uvicorn", "main:asgi_app", "--host", "0.0.0.0", "--port", "11111", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11111/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./notification_service/app:/app
    env_file:
      - .env

  # ============================================================================
  # Highload logging
  # ============================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      # - "9000:9000"   # TLC - I cannot set, everything works via 8123
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    env_file:
      - .env
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  vector:
    image: timberio/vector:nightly-distroless-libc
    container_name: vector
    hostname: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vector.toml:/etc/vector/vector.toml
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource

volumes:
  kafka-1-data:
    driver: local
  kafka-2-data:
    driver: local
  kafka-3-data:
    driver: local
  frontend_node_modules:
    driver: local
