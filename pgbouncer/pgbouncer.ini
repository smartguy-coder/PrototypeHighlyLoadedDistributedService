[databases]
; Connect to any database through pgbouncer
; host = postgres hostname, port = postgres port
* = host=postgres_storefront_catalog_service port=5432

[pgbouncer]
; Network settings
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool settings
; transaction - best for web apps (connection per transaction)
; session - connection per session (like direct postgres connection)
pool_mode = transaction

; Connection limits
max_client_conn = 200
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5.0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Connection handling
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30

; Ignore extra parameters from clients
ignore_startup_parameters = extra_float_digits

; Admin console settings (optional)
admin_users = postgres
stats_users = postgres
